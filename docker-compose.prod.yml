# Production / VPS stack — pulls prebuilt images from GHCR (no local build).
# Usage on VPS:
#   cp .env.prod.example .env
#   # edit secrets + image tag
#   ./deploy/pull-up.sh
#
# Or manually:
#   docker login ghcr.io
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

name: syverro

services:
  postgres:
    image: postgres:15
    container_name: syverro-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syverro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-syverro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind to localhost only — put a reverse proxy in front if needed.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syverro} -d ${POSTGRES_DB:-syverro}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nikkalma/syverro-backend:${IMAGE_TAG:-main}}
    container_name: syverro-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-syverro}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-syverro}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_AUTH_MAX_AGE_SECONDS: ${TELEGRAM_AUTH_MAX_AGE_SECONDS:-300}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      SITE_URL: ${SITE_URL:-https://syverro.com}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-syverro.com}
      # --- SyvAI (all forwarded from the VPS .env; the API key is a secret,
      # --- never hardcoded here. Empty/absent values fail safely.) ---
      SYVAI_OPENAI_API_KEY: ${SYVAI_OPENAI_API_KEY:-}
      SYVAI_OPENAI_BASE_URL: ${SYVAI_OPENAI_BASE_URL:-https://api.openai.com/v1}
      SYVAI_OPENAI_MODEL: ${SYVAI_OPENAI_MODEL:-gpt-4o-mini}
      SYVAI_PROVIDER_TIMEOUT_SECONDS: ${SYVAI_PROVIDER_TIMEOUT_SECONDS:-60}
      SYVAI_PROVIDER_TEMPERATURE: ${SYVAI_PROVIDER_TEMPERATURE:-0}
      SYVAI_PROVIDER_MAX_TOKENS: ${SYVAI_PROVIDER_MAX_TOKENS:-4096}
      SYVAI_DISCOVERY_ENABLED: ${SYVAI_DISCOVERY_ENABLED:-}
      SYVAI_DISCOVERY_PROVIDER: ${SYVAI_DISCOVERY_PROVIDER:-wikipedia}
      SYVAI_DISCOVERY_PROVIDERS: ${SYVAI_DISCOVERY_PROVIDERS:-wikipedia,loc,archive}
      SYVAI_DISCOVERY_MAX_CANDIDATES: ${SYVAI_DISCOVERY_MAX_CANDIDATES:-5}
      SYVAI_DISCOVERY_MAX_PER_FAMILY: ${SYVAI_DISCOVERY_MAX_PER_FAMILY:-2}
      SYVAI_DISCOVERY_DETAIL_MAX_PER_RUN: ${SYVAI_DISCOVERY_DETAIL_MAX_PER_RUN:-6}
      SYVAI_DISCOVERY_TIMEOUT_SECONDS: ${SYVAI_DISCOVERY_TIMEOUT_SECONDS:-15}
      SYVAI_DISCOVERY_MAX_PAGE_BYTES: ${SYVAI_DISCOVERY_MAX_PAGE_BYTES:-500000}
      SYVAI_DISCOVERY_USER_AGENT: ${SYVAI_DISCOVERY_USER_AGENT:-SyverroSyvAI/0.2 (+https://syverro.com)}
      # Deterministic ru.wikipedia -> EN identity bootstrap (no LLM). Operator
      # decision; default off.
      SYVAI_DISCOVERY_LANGLINKS_BOOTSTRAP: ${SYVAI_DISCOVERY_LANGLINKS_BOOTSTRAP:-}
      # Phase-2 ru.wikipedia search fallback with mandatory structured Wikidata
      # BIND (fail-closed request budget). Operator decision; default off.
      SYVAI_DISCOVERY_RUWIKI_SEARCH_FALLBACK: ${SYVAI_DISCOVERY_RUWIKI_SEARCH_FALLBACK:-}
      SYVAI_DISCOVERY_FALLBACK_MAX_REQUESTS: ${SYVAI_DISCOVERY_FALLBACK_MAX_REQUESTS:-6}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    image: ${WEB_IMAGE:-ghcr.io/nikkalma/syverro-web:${IMAGE_TAG:-main}}
    container_name: syverro-web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:80"

volumes:
  postgres_data:
