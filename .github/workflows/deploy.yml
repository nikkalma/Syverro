name: Deploy

on:
  workflow_run:
    workflows: [Publish]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy-vps:
    name: Deploy VPS
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve image tag
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          FULL_SHA: ${{ github.event.workflow_run.head_sha }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          OWNER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/opt/syverro' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: FULL_SHA,SHORT_SHA,OWNER,GHCR_TOKEN,VPS_APP_DIR
          script_stop: true
          script: |
            set -euo pipefail
            cd "$VPS_APP_DIR"

            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "Refusing to deploy over tracked changes in $VPS_APP_DIR" >&2
              exit 1
            fi
            git fetch --quiet origin "$FULL_SHA"
            git checkout --detach "$FULL_SHA"

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$OWNER" --password-stdin
            fi

            export IMAGE_TAG="sha-${SHORT_SHA}"
            export BACKEND_IMAGE="ghcr.io/${OWNER}/syverro-backend:${IMAGE_TAG}"
            export WEB_IMAGE="ghcr.io/${OWNER}/syverro-web:${IMAGE_TAG}"

            if [ -x ./deploy/pull-up.sh ]; then
              ./deploy/pull-up.sh
            else
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            fi
